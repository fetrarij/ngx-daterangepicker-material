<h1>Simple</h1>
<p class="lead">
    Add <code>ngxDaterangepickerMd</code> to an input and bind it with <code>ngModel</code>. The app also needs
    <code>provideDaterangepicker()</code> in its providers.
</p>

<demo-example
    name="basic-range"

    description="Click two days, then Apply. The value is an object with startDate and endDate (dayjs dates).">

</demo-example>
