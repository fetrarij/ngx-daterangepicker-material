<h1>Simple</h1>
<p class="lead">
    Add <code>ngxDaterangepickerMd</code> to an input and bind it with <code>ngModel</code>. The app also needs
    <code>NgxDaterangepickerMd.forRoot()</code> in its providers.
</p>
