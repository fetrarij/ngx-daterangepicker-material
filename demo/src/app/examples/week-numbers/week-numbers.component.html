<div class="demo-grid">
    <label class="demo-field">
        showWeekNumbers
        <input type="text" ngxDaterangepickerMd [showWeekNumbers]="true" [(ngModel)]="selected" placeholder="Weeks of the locale" />
    </label>
    <label class="demo-field">
        showISOWeekNumbers
        <input type="text" ngxDaterangepickerMd [showISOWeekNumbers]="true" [(ngModel)]="selectedIso" placeholder="ISO weeks" />
    </label>
</div>
