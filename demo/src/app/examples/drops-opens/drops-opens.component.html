<div class="demo-grid">
    <label class="demo-field">
        opens="right"
        <input type="text" ngxDaterangepickerMd opens="right" [(ngModel)]="selected" placeholder="Opens to the right" />
    </label>
    <label class="demo-field">
        opens="center"
        <input type="text" ngxDaterangepickerMd opens="center" [(ngModel)]="selected" placeholder="Opens in the center" />
    </label>
    <label class="demo-field">
        opens="left"
        <input type="text" ngxDaterangepickerMd opens="left" [(ngModel)]="selected" placeholder="Opens to the left" />
    </label>
    <label class="demo-field">
        drops="up"
        <input type="text" ngxDaterangepickerMd drops="up" opens="right" [(ngModel)]="selected" placeholder="Opens above" />
    </label>
</div>
